name: Import locked MEMO artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-memo.yml'
      - 'scripts/prepare_assets.py'
      - 'scripts/locked-source-transfer.tsv'
permissions:
  contents: write
concurrency:
  group: memo-locked-artwork
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and crop the selected source
        run: |
          python -m pip install --quiet pillow
          python scripts/prepare_assets.py
      - name: Archive original and web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/approved docs/assets/locked
          if ! git diff --cached --quiet; then
            git commit -m 'assets: archive pixel-verified MEMO reference and 20 lossless website crops'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
