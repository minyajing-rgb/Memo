name: Sync MEMO approved campaign assets

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-memo-assets.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download approved visual assets from MEMO source conversation
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import html as htmlmod
          import io
          import re
          import urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          SHARE = "https://chatgpt.com/share/6aae7ce0-961c-83ee-8b6c-7eb443b344cb"
          req = urllib.request.Request(SHARE, headers={"User-Agent": "Mozilla/5.0"})
          raw = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "ignore")
          raw = htmlmod.unescape(raw).replace("\\u0026", "&")

          found = re.findall(r'https://images\.openai\.com/static-rsc-[^"\\<>\s]+', raw)
          urls = []
          for u in found:
              u = u.rstrip("),]}\\'")
              if u not in urls:
                  urls.append(u)

          headers = {"User-Agent": "Mozilla/5.0", "Referer": "https://chatgpt.com/"}
          candidates = []
          for i, url in enumerate(urls):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  data = urllib.request.urlopen(req, timeout=45).read()
                  im = Image.open(io.BytesIO(data)).convert("RGB")
                  w, h = im.size
                  ratio = w / h
                  # Keep high-quality fashion/editorial images. Strongly prefer 4:5-ish
                  # portrait MEMO generations, while retaining a few large landscape/detail
                  # assets so the website can use them as feature banners.
                  if w >= 500 and h >= 500 and len(data) >= 20000:
                      portrait_bonus = 5_000_000 if 0.72 <= ratio <= 0.86 else 0
                      landscape_bonus = 1_500_000 if 1.15 <= ratio <= 1.65 else 0
                      square_bonus = 500_000 if 0.90 <= ratio <= 1.10 else 0
                      score = portrait_bonus + landscape_bonus + square_bonus + (w*h) + len(data)
                      candidates.append((score, im, url, (w, h)))
              except Exception:
                  pass

          candidates.sort(key=lambda x: x[0], reverse=True)
          out = Path("docs/assets/campaign")
          out.mkdir(parents=True, exist_ok=True)

          # remove older synced assets so numbering stays deterministic
          for p in out.glob("memo-*.jpg"):
              p.unlink()

          manifest = []
          for n, (_, im, url, dims) in enumerate(candidates[:12], start=1):
              # keep enough resolution for desktop while avoiding huge pages
              im = ImageOps.exif_transpose(im)
              if im.width > 1400:
                  h = round(im.height * 1400 / im.width)
                  im = im.resize((1400, h), Image.Resampling.LANCZOS)
              path = out / f"memo-{n:02d}.jpg"
              im.save(path, "JPEG", quality=90, optimize=True, progressive=True)
              manifest.append(f"{path.name}\t{dims[0]}x{dims[1]}\t{url}")

          Path("docs/assets/campaign/manifest.tsv").write_text(
              "\n".join(manifest) + ("\n" if manifest else ""),
              encoding="utf-8"
          )
          print(f"Saved {len(manifest)} MEMO assets")
          PY

      - name: Commit synced assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/campaign
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "assets: sync approved MEMO campaign visuals"
            git push
          fi
